name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned iOS App
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build App (Simulator/Unsigned)
        run: |
          cd iOS
          # Compilar la aplicación sin firmar
          xcodebuild clean build \
            -project FuOst.xcodeproj \
            -scheme FuOst \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ./build > build.log 2>&1
          
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: iOS/build.log

      - name: Package to IPA
        run: |
          cd iOS/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r FuOst.app Payload/
          zip -r FuOst.ipa Payload/
          mv FuOst.ipa ../../../../FuOst.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuOst-Installable-IPA
          path: iOS/FuOst.ipa
