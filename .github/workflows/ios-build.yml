name: iOS Build with MobAI-App/ios-builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      # Implementación genérica para construcción de iOS
      # Asumiendo que ios-builder maneja el xcodebuild
      - name: Build iOS Application
        run: |
          cd iOS/FuOst
          # Aquí reemplazaríamos con el comando exacto de ios-builder si usa Fastlane o xcodebuild
          # Ejemplo con xcodebuild (requerirá un .xcodeproj o .xcworkspace que Xcode genera)
          echo "Ejecutando proceso de compilación..."
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuOst-iOS-Build
          path: iOS/FuOst/build/
